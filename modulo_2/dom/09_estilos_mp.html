<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Manipulación de Estilos de Eventos</title>
  <style>
    #cuadro {
      background-color: #255e06ff;
      border-radius: 10px;
      transition: all 0.5s ease;
    }
  </style>
</head>
<body>

  <h1>Gestión Visual de Eventos</h1>

  <div id="cuadro" style="width: 100px; height: 100px;"></div>
  
  <div style="margin-top:20px;">
    <button onclick="cambiarColor()"> Cambiar Color del Evento</button>
    <button onclick="aumentarTamano()"> Aumentar Tamaño del Evento</button>
    <button onclick="reiniciar()"> Reiniciar Estilo</button>
  </div>

  <script src="09_estilos.js"></script>
</body>
</html>
